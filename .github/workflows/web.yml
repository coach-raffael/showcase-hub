name: web

# Lint + Build des Frontends; auf main zusätzlich Docker-Image nach GHCR.
# BASE_PATH (Repository-Variable, Standard leer) wird beim Build eingebacken:
# leer = Domain-Wurzel (demos.coach-raffael.com).

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          API_URL: http://localhost:8080
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}

  docker:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            BASE_PATH=${{ vars.BASE_PATH }}
          cache-from: type=gha,scope=demos-web
          cache-to: type=gha,scope=demos-web,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
