name: api

# Baut und testet das Backend (inkl. Integrationstests gegen echtes Postgres per
# Testcontainers); auf main zusätzlich Docker-Image nach GHCR.

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & Test
        env:
          CI: "true"   # schaltet die Testcontainers-Integrationstests ein
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: |
          grep -E "\[ERROR\]|FAILED|Tests run:.*Fail" build.log | grep -v "^\[ERROR\] *$" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

  # Auf PRs wird das Image nur gebaut (nicht gepusht) – Fehler im Dockerfile fallen so vor dem Merge auf.
  docker:
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=demos-api
          cache-to: type=gha,scope=demos-api,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
